<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmallBiz Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>SmallBiz Store</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#shop">Shop</a>
    <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
    <a href="#admin">Admin</a>
  </nav>
</header>

<!-- HOME -->
<section id="home">
  <h2>Welcome to SmallBiz Store</h2>
  <p>Simple e-commerce for small businesses.</p>
</section>

<!-- SHOP -->
<section id="shop">
  <h2>Products</h2>
  <div class="products">

    <div class="product">
      <img src="Images/OIP (1).webp" width="240" height="240" alt="T-Shirt">
      <h3>T-Shirt</h3>
      <p>R120</p>
      <button onclick="addToCart('T-Shirt',120)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="Images/OIP.webp" width="240" height="240" alt="Sneakers">
      <h3>Sneakers</h3>
      <p>R450</p>
      <button onclick="addToCart('Sneakers',450)">Add to Cart</button>
    </div>

    <div class="product">
      <h3>Cap</h3>
      <img src="Images/download.webp" width="240" height="240" alt="Cap">
      <p>R80</p>
      <button onclick="addToCart('Cap',80)">Add to Cart</button>
    </div>

  </div>
</section>

<!-- CART -->
<section id="cart">
  <h2>Your Cart</h2>
  <ul id="cart-items"></ul>
  <h3>Total: R<span id="total">0</span></h3>
</section>

<!-- ADMIN -->
<section id="admin">
  <h2>Admin Dashboard</h2>
  <p>Manage products (demo only)</p>
  <input type="text" placeholder="Product name">
  <input type="number" placeholder="Price">
  <button>Add Product</button>
</section>

<script src="script.js"></script>
</body>
</html>
